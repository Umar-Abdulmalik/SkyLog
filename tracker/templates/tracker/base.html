{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Keep every aircraft airworthy{% endblock %} | SkyLog</title>
  <link rel="preload" href="{% static 'tracker/fonts/archivo.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'tracker/style.css' %}">
  <script>
    (function () {
      var root = document.documentElement;
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) { t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
      root.setAttribute("data-theme", t);
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window) {
        root.classList.add("js");
      }
    })();
  </script>
</head>
<body>
{% block body %}{% endblock %}
<script src="{% static 'tracker/app.js' %}"></script>
</body>
</html>
