{% extends "tracker/app.html" %}

{% block title %}Delete task{% endblock %}

{% block content %}
<p class="crumbs"><a href="{% url 'task_edit' object.pk %}">&larr; Back</a></p>

<header class="page-head">
  <h1>Delete task</h1>
</header>

<form method="post" class="form panel">
  {% csrf_token %}
  <p>Are you sure you want to delete <strong>{{ object.title }}</strong> for {{ object.aircraft.registration }}? This cannot be undone.</p>
  <div class="form-actions">
    <button class="btn-app btn-danger" type="submit">Yes, delete it</button>
    <a href="{% url 'task_edit' object.pk %}">Cancel</a>
  </div>
</form>
{% endblock %}
